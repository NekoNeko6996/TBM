<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Workspace Aside</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="sp-header">
    <button id="btn-open-dashboard" class="btn-primary">⚙️ Mở Trang Quản Trị</button>
    <button id="btn-bookmark-active" class="btn-secondary" title="Lưu tab hiện tại vào Bookmark">+ Lưu Tab</button>
  </header>

  <nav class="sp-tabs">
    <button class="tab-btn active" data-tab="active-groups">Đang mở</button>
    <button class="tab-btn" data-tab="saved-groups">Đã lưu</button>
    <button class="tab-btn" data-tab="bookmarks">Bookmarks</button>
  </nav>

  <main class="sp-content">
    <!-- Tab 1: Active Tab Groups -->
    <section id="active-groups" class="tab-pane active"></section>

    <!-- Tab 2: Saved Groups -->
    <section id="saved-groups" class="tab-pane"></section>

    <!-- Tab 3: Independent Bookmarks -->
    <section id="bookmarks" class="tab-pane">
      <div class="bm-toolbar">
        <select id="sp-folder-select"></select>
        <button id="btn-new-folder" class="btn-icon" title="Tạo thư mục mới">+📁</button>
      </div>
      <div id="sp-bookmark-tree"></div>
    </section>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
