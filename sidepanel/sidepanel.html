<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Workspace Aside</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="sp-header">
    <div class="sp-brand">Workspace</div>
    <div class="sp-header-actions">
      <button id="btn-bookmark-active" class="btn-outline" title="Lưu tab hiện tại vào thư mục đang mở">+ Save Tab</button>
      <button id="btn-open-dashboard" class="btn-primary">Dashboard</button>
    </div>
  </header>

  <nav class="sp-tabs">
    <button class="tab-btn active" data-tab="active-groups">Open Groups</button>
    <button class="tab-btn" data-tab="saved-groups">Saved</button>
    <button class="tab-btn" data-tab="bookmarks">Bookmarks</button>
  </nav>

  <main class="sp-content">
    <!-- Tab 1: Nhóm đang mở -->
    <section id="active-groups" class="tab-pane active"></section>

    <!-- Tab 2: Nhóm đã lưu -->
    <section id="saved-groups" class="tab-pane"></section>

    <!-- Tab 3: Bookmark Folder Explorer -->
    <section id="bookmarks" class="tab-pane">
      <div class="bm-explorer-bar">
        <div class="bm-nav-left">
          <button id="btn-sp-up" class="btn-outline" disabled>Up</button>
          <div id="sp-breadcrumbs" class="sp-breadcrumbs"></div>
        </div>
        <button id="btn-new-folder" class="btn-text">+ Folder</button>
      </div>
      <div id="sp-bookmark-list" class="sp-explorer-list"></div>
    </section>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
